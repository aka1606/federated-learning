[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tp3-federated-learning"
version = "1.0.0"
description = "Federated Learning Security — TP3 (attacks & defenses)"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.26.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy",
    "matplotlib",
    "prettytable",
    "tomli",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tp3example"]

[tool.flwr.app]
publisher = "tp3"

[tool.flwr.app.components]
serverapp = "tp3example.server_app:app"
clientapp = "tp3example.client_app:app"

[tool.flwr.app.config]
# ---- Server ----
num-server-rounds = 50
fraction-train    = 1.0
seed              = 42

# ---- Local training ----
local-epochs = 3
batch-size   = 64
learning-rate = 0.01
data-dir      = "./data"

# ---- Data distribution ----
num-clients      = 50
alpha-dirichlet  = 10.0

# ---- Attack configuration ----
# malicious-ratio: fraction of malicious clients (0.0, 0.25, 0.5)
# attack-type:     "none", "data", "model"
malicious-ratio = 0.0
attack-type     = "none"

# ---- Aggregation strategy ----
# strategy: "fedavg" | "fedmedian" | "krum"
strategy = "fedavg"

# ---- Output ----
output-dir = "results/raw"
